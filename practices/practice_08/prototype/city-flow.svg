<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">Прототип: выбор города в сервисе «Акции рядом»</title><desc id="desc">Пять состояний формы: пустое, ввод, сохранение, успешное сохранение и ошибка.</desc>
<rect width="1440" height="850" fill="#f4f5fc"/><g font-family="Arial,sans-serif" fill="#202940"><text x="56" y="65" font-size="30" font-weight="bold">акции<tspan fill="#bd4e3a">рядом.</tspan></text><text x="56" y="117" font-size="33" font-weight="bold">Выбор города</text><text x="56" y="150" font-size="17" fill="#59667d">Прототип основного сценария · состояния формы</text></g>
<g font-family="Arial,sans-serif"><g transform="translate(55 195)"><text y="-15" fill="#59667d" font-size="15">01 / Пустое состояние</text><rect width="400" height="235" rx="15" fill="white" stroke="#dce1f0"/><text x="22" y="34" fill="#59667d" font-size="11" font-weight="bold">ВАШ ГОРОД</text><text x="22" y="67" fill="#202940" font-size="14">Где искать предложения?</text><rect x="22" y="79" width="356" height="43" rx="8" fill="#fbfcff" stroke="#b9c3dc"/><text x="34" y="106" fill="#7c889d" font-size="14">Санкт-Петербург</text><rect x="22" y="134" width="356" height="42" rx="8" fill="#324fb0"/><text x="145" y="160" fill="white" font-size="14">Сохранить город</text><text x="22" y="204" fill="#59667d" font-size="13">Город пока не выбран.</text></g>
<g transform="translate(520 195)"><text y="-15" fill="#59667d" font-size="15">02 / Ввод</text><rect width="400" height="235" rx="15" fill="white" stroke="#dce1f0"/><text x="22" y="34" fill="#59667d" font-size="11" font-weight="bold">ВАШ ГОРОД</text><text x="22" y="67" fill="#202940" font-size="14">Где искать предложения?</text><rect x="22" y="79" width="356" height="43" rx="8" fill="#fbfcff" stroke="#b44732" stroke-width="3"/><text x="34" y="106" fill="#202940" font-size="14">Москва</text><rect x="22" y="134" width="356" height="42" rx="8" fill="#324fb0"/><text x="145" y="160" fill="white" font-size="14">Сохранить город</text><text x="22" y="204" fill="#59667d" font-size="13">Город пока не выбран.</text></g>
<g transform="translate(985 195)"><text y="-15" fill="#59667d" font-size="15">03 / Сохранение</text><rect width="400" height="235" rx="15" fill="white" stroke="#dce1f0"/><text x="22" y="34" fill="#59667d" font-size="11" font-weight="bold">ВАШ ГОРОД</text><text x="22" y="67" fill="#202940" font-size="14">Где искать предложения?</text><rect x="22" y="79" width="356" height="43" rx="8" fill="#fbfcff" stroke="#b9c3dc"/><text x="34" y="106" fill="#202940" font-size="14">Москва</text><rect x="22" y="134" width="356" height="42" rx="8" fill="#7b8dc8"/><text x="160" y="160" fill="white" font-size="14">Сохраняем…</text><text x="22" y="204" fill="#59667d" font-size="13">Сохраняем город…</text></g>
<g transform="translate(55 500)"><text y="-15" fill="#59667d" font-size="15">04 / Успех</text><rect width="400" height="255" rx="15" fill="white" stroke="#dce1f0"/><text x="22" y="34" fill="#59667d" font-size="11" font-weight="bold">ВАШ ГОРОД</text><text x="22" y="67" fill="#202940" font-size="14">Где искать предложения?</text><rect x="22" y="79" width="356" height="43" rx="8" fill="#fbfcff" stroke="#b9c3dc"/><text x="34" y="106" fill="#202940" font-size="14">Москва</text><rect x="22" y="134" width="356" height="42" rx="8" fill="#324fb0"/><text x="145" y="160" fill="white" font-size="14">Сохранить город</text><text x="22" y="203" fill="#324fb0" font-size="13">Город сохранён: Москва. Обновите страницу,</text><text x="22" y="222" fill="#324fb0" font-size="13">чтобы пересчитать данные.</text></g>
<g transform="translate(520 500)"><text y="-15" fill="#59667d" font-size="15">05 / Ошибка и повтор</text><rect width="400" height="255" rx="15" fill="white" stroke="#dce1f0"/><text x="22" y="34" fill="#59667d" font-size="11" font-weight="bold">ВАШ ГОРОД</text><text x="22" y="67" fill="#202940" font-size="14">Где искать предложения?</text><rect x="22" y="79" width="356" height="43" rx="8" fill="#fbfcff" stroke="#b9c3dc"/><text x="34" y="106" fill="#202940" font-size="14">Москва</text><rect x="22" y="134" width="356" height="42" rx="8" fill="#324fb0"/><text x="145" y="160" fill="white" font-size="14">Сохранить город</text><text x="22" y="203" fill="#a32635" font-size="13">Не удалось сохранить город. Проверьте</text><text x="22" y="222" fill="#a32635" font-size="13">соединение и повторите попытку.</text></g></g></svg>
