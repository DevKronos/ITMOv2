<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Потоки данных Mini Shop</title>
<desc id="desc">Клиент обращается к HTTP обработчику и добавляет отзывы. Сессия определяет доступ к SQLite и чекам. Отзывы и данные SQLite поступают в контекст помощника. Ответ LLM проверяется исполнителем перед доступом к чекам. Сотрудник получает полномочия через сессию.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1000" height="1000" fill="#fff"/>
<g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
